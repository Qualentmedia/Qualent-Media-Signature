# Project-wide Gradle settings.
# JVM arguments used for the Gradle daemon. Bump heap for AGP builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run builds in parallel and cache outputs for faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX is required by modern androidx.* libraries.
android.useAndroidX=true
# Kotlin code style.
kotlin.code.style=official
# Only the resources actually used by the module are packaged (smaller APK).
android.nonTransitiveRClass=true
